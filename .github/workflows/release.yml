name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag can release (vd: v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: build + push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    name: dong goi source zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tao zip (khong kem model / venv / runtime)
        run: |
          set -eux
          mkdir -p dist
          zip -r "dist/ngu-${{ github.ref_name }}.zip" \
            app static scripts tests k8s \
            .config .github \
            Dockerfile docker-compose.yml pyproject.toml uv.lock \
            setup.bat setup-report.txt README.md LICENSE \
            -x "*.pyc" "__pycache__/*" ".git/*"
          cd dist
          sha256sum "ngu-${{ github.ref_name }}.zip" > "ngu-${{ github.ref_name }}.zip.sha256"
          cat "ngu-${{ github.ref_name }}.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ngu-package
          path: dist/*

  release:
    name: tao GitHub Release
    needs: [docker, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ngu-package
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## local-agents ${{ github.ref_name }}

            - Docker: `docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - `docker compose up -d`
            - Web board: http://127.0.0.1:8765/
            - MCP: http://127.0.0.1:8765/mcp
