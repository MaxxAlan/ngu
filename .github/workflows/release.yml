name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag can release (vd: v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  LLAMA_TAG: b12329
  # tag can release (tu workflow_dispatch input, hoac tag push)
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # ten image trong registry (docker yeu cau lowercase)
  IMAGE_REF: ghcr.io/maxxalan/ngu

jobs:
  docker:
    name: build + push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ngu
            org.opencontainers.image.description=Local coding agent on llama.cpp (CLI + web board + MCP)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=MaxxAlan
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Dong goi san cho user: bo llama.cpp runtime (da build) + bundle portable
  # ------------------------------------------------------------------
  package:
    name: build release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tai dong goi llama.cpp (windows) cho tung bien do ho tro
        run: |
          set -eux
          mkdir -p dist work
          for v in cpu vulkan cuda-12.4 cuda-13.5; do
            case "$v" in
              cpu)        asset="llama-${LLAMA_TAG}-bin-win-cpu-x64.zip" ;;
              vulkan)     asset="llama-${LLAMA_TAG}-bin-win-vulkan-x64.zip" ;;
              cuda-12.4)  asset="llama-${LLAMA_TAG}-bin-win-cuda-12.4-x64.zip" ;;
              cuda-13.5)  asset="llama-${LLAMA_TAG}-bin-win-cuda-13.5-x64.zip" ;;
            esac
            echo "--- $v <- $asset"
            curl -fsSL -o "work/$v.zip" \
              "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/${asset}"
            mkdir -p "work/$v"
            unzip -q -o "work/$v.zip" -d "work/$v"
            # them runtime CUDA (cublas/cudart) cho ban cuda
            # ten asset cua cudart KHONG co so build: cudart-llama-bin-win-<variant>-x64.zip
            case "$v" in
              cuda-*)
                curl -fsSL -o "work/$v-cudart.zip" \
                  "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/cudart-llama-bin-win-${v}-x64.zip"
                unzip -q -o "work/$v-cudart.zip" -d "work/$v-cudart"
                find "work/$v-cudart" -name '*.dll' -exec cp -f {} "work/$v/" \; 2>/dev/null || true
              ;;
            esac
            # flatten: chi lay thu muc chua llama-server.exe
            srcdir=$(dirname "$(find "work/$v" -name llama-server.exe | head -1)")
            (cd "$srcdir" && zip -r -X "$GITHUB_WORKSPACE/dist/llama-$v.zip" .)
            echo "dist/llama-$v.zip: $(du -h "dist/llama-$v.zip" | cut -f1)"
          done

      - name: Tao bundle portable (source + runtime CPU)
        run: |
          set -eux
          rm -rf work/portable
          mkdir -p work/portable
          cp -r app static scripts k8s tests .config .github \
                Dockerfile docker-compose.yml pyproject.toml uv.lock \
                setup.bat ngu.cmd README.md SETUP.md LICENSE .gitignore .gitattributes \
                work/portable/
          mkdir -p work/portable/runtime/llama.cpp
          srcdir=$(dirname "$(find work/cpu -name llama-server.exe | head -1)")
          cp -rf "$srcdir"/* work/portable/runtime/llama.cpp/
          (cd work/portable && zip -r -X "$GITHUB_WORKSPACE/dist/ngu-portable-${{ env.RELEASE_TAG }}.zip" .)
          ls -lh dist/

      - name: Tao source zip
        run: |
          set -eux
          mkdir -p dist
          zip -r -X "dist/ngu-${{ env.RELEASE_TAG }}-src.zip" \
            app static scripts tests k8s .config .github \
            Dockerfile docker-compose.yml pyproject.toml uv.lock \
            setup.bat ngu.cmd README.md SETUP.md LICENSE .gitignore .gitattributes \
            -x "*.pyc" "__pycache__/*"
          cd dist
          sha256sum *.zip > SHA256SUMS.txt

      # image docker dang file: user tai ve roi "docker load" - khong can registry
      - name: Export image (docker load offline)
        run: |
          set -eux
          docker pull "${{ env.IMAGE_REF }}:${{ env.RELEASE_TAG }}"
          docker save "${{ env.IMAGE_REF }}:${{ env.RELEASE_TAG }}" \
            | gzip -1 > "dist/ngu-image-${{ env.RELEASE_TAG }}.tar.gz"
          ls -lh dist/
          cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ngu-release-assets
          path: dist/*

  release:
    name: tao GitHub Release
    needs: [docker, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ngu-release-assets
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## local-agents ${{ env.RELEASE_TAG }}

            ### Cai dat nhanh (Windows)

            ```powershell
            git clone https://github.com/MaxxAlan/ngu.git
            cd ngu
            setup.bat          # Run as Administrator
            ```

            Hoac tai bundle portable (source + llama.cpp CPU da build san):

            ```
            https://github.com/MaxxAlan/ngu/releases/latest/download/ngu-portable-${{ env.RELEASE_TAG }}.zip
            ```

            ### Docker

            ```bash
            # cach 1: pull tu GHCR
            docker pull ${{ env.IMAGE_REF }}:${{ env.RELEASE_TAG }}
            docker compose up -d

            # cach 2: khong can registry - tai image tarball roi load
            curl -LO https://github.com/${{ github.repository }}/releases/latest/download/ngu-image-${{ env.RELEASE_TAG }}.tar.gz
            docker load -i ngu-image-${{ env.RELEASE_TAG }}.tar.gz
            docker compose up -d
            ```

            - Web board: http://127.0.0.1:8765/
            - MCP: http://127.0.0.1:8765/mcp

            ### Ban llama.cpp (setup.bat tu tai, ban nao cung dung)

            | file | dung cho |
            | --- | --- |
            | `llama-cpu.zip` | may khong co GPU |
            | `llama-vulkan.zip` | AMD / Intel |
            | `llama-cuda-12.4.zip` | NVIDIA driver >= 550 |
            | `llama-cuda-13.5.zip` | NVIDIA driver >= 580 |
