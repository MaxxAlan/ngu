name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen --group dev
      - name: Ruff
        run: uv run ruff check .

  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install deps
        run: uv sync --frozen --group dev --python ${{ matrix.python }}
      - name: Pytest
        run: uv run pytest

  setup-script:
    name: setup.ps1 (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run setup (khong tai model, khong smoke test)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup.ps1 -Models none -SkipSmoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload setup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-report
          path: |
            setup-report.txt
            data/setup.log
          if-no-files-found: ignore

  # Docker image KHONG build tren CI - build local roi push len GHCR:
  #   docker build -t ghcr.io/maxxalan/ngu:latest .
  #   docker push ghcr.io/maxxalan/ngu:latest
